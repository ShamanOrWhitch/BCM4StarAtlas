<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photoli Lite</title><style>body{font:15px system-ui,sans-serif;background:#101926;color:#eef4fb;margin:0}header{padding:14px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}label{display:flex;align-items:center;gap:7px}input{width:120px}canvas{display:block;width:100%;height:65vh;touch-action:none;background:#192636}p{padding:0 14px;color:#bbc9d8}</style></head><body><header><strong>Photoli · лёгкая проба</strong><label>Форма <input id="shape" type="range" min="0" max="100" value="35"><output id="shapeVal">35%</output></label><label>Перелив <input id="live" type="range" min="0" max="100" value="65"><output id="liveVal">65%</output></label></header><canvas id="screen"></canvas><p>Двигай ползунки; вращение — перетаскиванием. Это приближённая демонстрация на 2D Canvas, не игровой WebGL-рендер.</p><script>
(function(){
var c=document.getElementById('screen'),ctx=c.getContext('2d');if(!ctx){document.querySelector('p').textContent='2D Canvas не запустился в этом просмотрщике.';return;}
var m=document.getElementById('shape'),l=document.getElementById('live'),yaw=.65,drag=false,prev=0;var nr=27,ns=4,N=ns*4;
function size(){var d=Math.min(devicePixelRatio||1,1.4),r=c.getBoundingClientRect();c.width=Math.max(1,Math.round(r.width*d));c.height=Math.max(1,Math.round(r.height*d));}window.addEventListener('resize',size);size();
c.addEventListener('pointerdown',function(e){drag=true;prev=e.clientX;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',function(e){if(drag){yaw+=(e.clientX-prev)*.012;prev=e.clientX;}});c.addEventListener('pointerup',function(){drag=false});c.addEventListener('pointercancel',function(){drag=false});
function draw(ts){
 var time=ts*.001,shape=+m.value/100,life=+l.value/100;document.getElementById('shapeVal').textContent=m.value+'%';document.getElementById('liveVal').textContent=l.value+'%';
 ctx.clearRect(0,0,c.width,c.height);var verts=[],screen=[],sc=Math.min(c.width,c.height)*.23,cy=Math.cos(yaw),sy=Math.sin(yaw);
 for(var i=0;i<nr;i++){var u=i/(nr-1),z=-1.75+3.5*u,w=.5*Math.pow(1-u,.70)+.012,h=.47*Math.pow(1-u,.8)+.012;
 for(var k=0;k<N;k++){var edge=Math.floor(k/ns),a=(k%ns)/ns,corners=[[-w,-h],[w,-h],[w,h],[-w,h]],p=corners[edge],q=corners[(edge+1)%4],x=p[0]*(1-a)+q[0]*a,y=p[1]*(1-a)+q[1]*a;
 x=x*(1+shape*.38*Math.sin(Math.PI*u))+shape*.13*Math.sin(2*Math.PI*u);y=y*(1-shape*.28*Math.sin(Math.PI*u))+life*.018*Math.sin(Math.PI*u)*Math.sin(time*1.2+u*9);
 var xx=x*cy+z*sy,zz=-x*sy+z*cy,yy=y*.91-zz*.41,depth=y*.41+zz*.91;verts.push([x,y,z]);screen.push([c.width*.5+xx*sc,c.height*.5-yy*sc,depth]);}}
 var faces=[];for(var i=0;i<nr-1;i++)for(var k=0;k<N;k++){var a=i*N+k,b=i*N+(k+1)%N,arr=[a,b,b+N,a+N],depth=0;for(var n=0;n<4;n++)depth+=screen[arr[n]][2];faces.push({ids:arr,d:depth/4,edge:Math.floor(k/ns),u:i/(nr-1)});}
 faces.sort(function(a,b){return a.d-b.d});
 for(var i=0;i<faces.length;i++){var f=faces[i],p=f.ids,ang=yaw+f.u*2+time*.14,b=.47+(.10*Math.cos(f.edge*1.57+yaw))+.11*life*Math.pow(Math.max(0,Math.sin(f.u*22-time*.8)),7),r=Math.max(0,Math.min(255,255*(b+.055*Math.cos(ang)))),g=Math.max(0,Math.min(255,255*(b+.055*Math.cos(ang+2.1)))),bl=Math.max(0,Math.min(255,255*(b+.055*Math.cos(ang+4.2))));ctx.fillStyle='rgb('+r+','+g+','+bl+')';ctx.beginPath();ctx.moveTo(screen[p[0]][0],screen[p[0]][1]);for(var k=1;k<4;k++)ctx.lineTo(screen[p[k]][0],screen[p[k]][1]);ctx.closePath();ctx.fill();}
}
var last=0;function loop(t){requestAnimationFrame(loop);if(t-last>75){draw(t);last=t}}requestAnimationFrame(loop);
})();</script></body></html>
