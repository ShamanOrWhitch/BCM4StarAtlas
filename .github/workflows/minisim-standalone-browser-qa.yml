name: Mini-Sim standalone browser QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "mini-sim/**"
      - "scripts/minisim-local-qa.mjs"
      - "scripts/minisim-standalone-qa.mjs"
      - "scripts/minisim-standalone-qa.test.mjs"
      - "tools/minisim-qa/**"
      - "package.json"
      - ".github/workflows/minisim-standalone-browser-qa.yml"

permissions:
  contents: read

jobs:
  standalone-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            mini-sim
            scripts
            tools/minisim-qa
          sparse-checkout-cone-mode: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the isolated Playwright dependency
        run: npm install
        working-directory: tools/minisim-qa
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: tools/minisim-qa
      - name: Run Mini-Sim source assertions
        run: npm run test:minisim
      - name: Run real browser smoke against standalone fixture
        run: npm run qa:minisim:standalone
      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minisim-standalone-browser-qa
          path: .qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
