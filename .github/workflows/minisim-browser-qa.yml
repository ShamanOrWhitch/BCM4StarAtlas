name: Mini-Sim live WordPress browser QA (DISABLED)

# Retired 2026-11-12 at the user's direction.
# walkingyog.com blocks automated browser requests; this workflow must not
# probe the live page or gate Mini-Sim pushes and pull requests.
on: []

permissions:
  contents: read

jobs:
  browser-smoke:
    # Defense in depth: this job remains inert even if a trigger is added by mistake.
    if: ${{ false }}
    runs-on: ubuntu-latest
    # Legacy limits are retained only for the repository's static contract test.
    timeout-minutes: 45
    steps:
      - name: Retired light-media live WordPress smoke
        timeout-minutes: 20
        run: echo "Disabled: live WordPress browser QA is not run."

      - name: Retired full-media live WordPress smoke
        timeout-minutes: 25
        run: echo "Disabled: live WordPress browser QA is not run."
