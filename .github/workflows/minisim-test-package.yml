name: Package Mini-Sim test build

on:
  push:
    branches: [main]
    paths:
      - 'mini-sim/**'
      - '.github/workflows/minisim-test-package.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mini-sim/**'
      - '.github/workflows/minisim-test-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Read plugin versions and verify package contents
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 'Version:' mini-sim/bcm-mini-sim.php | sed -E 's/.*Version: ([0-9.]+).*/\1/')"
          TOWER_VERSION="$(sed -n "s/.*define('BCM_TOWER_VERSION', '\([0-9.]*\)').*/\1/p" mini-sim/tower/bcm-tower.php | head -n 1)"
          test -n "$VERSION"
          test -n "$TOWER_VERSION"
          test -s mini-sim/assets/js/mini-sim.js
          test -s mini-sim/tower/assets/js/tower.js
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tower_version=$TOWER_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Mini-Sim $VERSION with Tower $TOWER_VERSION"

      - name: Require the committed First Planet bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s mini-sim/tower/first-planet/wp-dist/first-planet.js
          test -s mini-sim/tower/first-planet/wp-dist/first-planet.css
          grep -q "mount" mini-sim/tower/first-planet/wp-dist/first-planet.js

      - name: Install First Planet build dependencies
        run: npm ci
        working-directory: mini-sim/tower/first-planet

      - name: Build First Planet WordPress bundle
        run: npm run build:wordpress
        working-directory: mini-sim/tower/first-planet

      - name: Verify First Planet WordPress bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s mini-sim/tower/first-planet/wp-dist/first-planet.js
          test -s mini-sim/tower/first-planet/wp-dist/first-planet.css

      - name: Verify single-level package contents
        shell: bash
        run: |
          set -euo pipefail
          test -s mini-sim/bcm-mini-sim.php
          test -s mini-sim/tower/first-planet/wp-dist/first-planet.js
          test -s mini-sim/tower/first-planet/wp-dist/first-planet.css
          if find mini-sim -type f -iname '*.zip' -print -quit | grep -q .; then
            echo "Nested ZIP archives are forbidden inside the Mini-Sim package." >&2
            exit 1
          fi

      - name: Publish downloadable test artifact
        uses: actions/upload-artifact@v4
        with:
          name: bcm-mini-sim-${{ steps.version.outputs.version }}-test
          # upload-artifact creates the single downloadable ZIP itself.
          # The leading ** keeps mini-sim/ as the top-level plugin folder.\n          path: '**/mini-sim/**/*'
          if-no-files-found: error
          retention-days: 14
