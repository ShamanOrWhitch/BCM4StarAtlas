name: Tower top cap regression
on:
  push:
    branches:
      - main
      - fix/tower-top-cap-y-offset
  pull_request:
    branches:
      - main
    paths:
      - mini-sim/tower/assets/js/tower.js
      - mini-sim/assets/js/deep-space-warp.js
      - mini-sim/assets/js/hull-dive.js
      - mini-sim/assets/js/mini-sim.js
      - mini-sim/bcm-mini-sim.php
      - mini-sim/tower/bcm-tower.php
      - scripts/tower-top-cap.test.mjs
      - scripts/minisim-local-qa.test.mjs
      - scripts/asteroid-tower-hull-controls.test.mjs
      - .github/workflows/tower-top-cap-regression.yml
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check modified Mini-Sim JavaScript syntax
        run: |
          node --check mini-sim/assets/js/deep-space-warp.js
          node --check mini-sim/assets/js/hull-dive.js
          node --check mini-sim/assets/js/mini-sim.js
          node --check mini-sim/tower/assets/js/tower.js
      - name: Run Mini-Sim / Tower source-contract tests
        run: node --test scripts/tower-top-cap.test.mjs scripts/minisim-local-qa.test.mjs scripts/asteroid-tower-hull-controls.test.mjs
