name: verify-solanafm-wallet
on:
  push:
    branches:
      - verify-solanafm-wallet
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Query SolanaFM
        env:
          WALLET: 6p5qiitHPQN3iK5boUAxCXdYoZQCoBY1UdBKgT4jZfNY
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          wallet = os.environ["WALLET"]
          url = "https://api.solana.fm/v1/addresses/" + urllib.parse.quote(wallet, safe="") + "/tokens?tokenType=NonFungible"
          req = urllib.request.Request(url, headers={"Accept":"application/json","User-Agent":"BCM4StarAtlas-wallet-check/1.0"})
          with urllib.request.urlopen(req, timeout=45) as r:
              data = json.load(r)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
