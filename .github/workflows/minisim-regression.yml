name: Mini-Sim regression checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mini-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check mini-sim/assets/js/mini-sim.js
          node --check mini-sim/assets/js/deep-space-warp.js
          node --check mini-sim/assets/js/warp-bridge.js
          node --check mini-sim/assets/js/asteroid-maze-location.js
          node --check mini-sim/assets/js/warp-sector-core.js
          node --check mini-sim/assets/js/warp-sector-scene.js
          node --check mini-sim/assets/js/GLTFLoader.js
          node --check mini-sim/assets/js/hull-dive.js
          node --check mini-sim/assets/mesh/ships/xsmall/maxhog/maxhog_controls.js
          node --check mini-sim/tower/assets/js/tower.js
          node --check mini-sim/assets/js/crew-rig.js
          node --check mini-sim/assets/js/crew-core.js
          node --check mini-sim/assets/js/sage-map.js
          node --check mini-sim/assets/js/sage-map-core.js
          node --check mini-sim/assets/js/planet-landing.js
          node --check mini-sim/assets/js/room0-race.js
      - name: Check PHP syntax (a PHP error takes the whole plugin down)
        run: |
          php -l mini-sim/bcm-mini-sim.php
          php -l mini-sim/tower/bcm-tower.php
      - name: Install First Planet dependencies (three for the island rig test)
        run: npm ci --no-audit --no-fund
        working-directory: mini-sim/first-planet
      - name: Run Mini-Sim regression checks
        run: node --test scripts/warp-bridge.test.mjs scripts/minisim-ui-dialogue.test.mjs scripts/minisim-local-qa.test.mjs scripts/minisim-input-scope.test.mjs scripts/warp-maze-return.test.mjs scripts/asteroid-tower-hull-controls.test.mjs scripts/hull-english-copy.test.mjs scripts/asteroid-wall-crystal.test.mjs scripts/minisim-012-local-transitions.test.mjs scripts/ship-hull-states.test.mjs scripts/warp-sector-core.test.mjs scripts/crew-core-cutout.test.mjs scripts/crew-core-pose.test.mjs scripts/asteroid-field-open-space.test.mjs scripts/sage-map-galia.test.mjs scripts/first-planet-crew-walk.test.mjs scripts/first-planet-planet-by-sector.test.mjs scripts/first-planet-scene-imports.test.mjs scripts/first-planet-fable-relief.test.mjs scripts/tower-planet-landing-clip.test.mjs scripts/wallet-crew-names.test.mjs scripts/warp-second-jump-ship.test.mjs scripts/planet-opus.test.mjs scripts/planet-swap.test.mjs scripts/planet-content.test.mjs scripts/room0-race.test.mjs scripts/first-planet-race-track.test.mjs scripts/first-planet-live-bugs.test.mjs scripts/galia-fleet-and-tower-crew.test.mjs scripts/ship-nose.test.mjs scripts/crew-bay-scroll.test.mjs scripts/location-walk.test.mjs scripts/first-planet-race-modes.test.mjs scripts/first-planet-race-scenery.test.mjs scripts/ring-cell-look.test.mjs scripts/ring-panels.test.mjs scripts/ring-boss-moves.test.mjs scripts/ring-orbiter-flight.test.mjs scripts/ring-runner-chase.test.mjs scripts/ring-boss-arc-order.test.mjs scripts/ring-boss-transform-video.test.mjs scripts/ring-boss-arena-mechanics.test.mjs scripts/ring-flight-panel.test.mjs scripts/ring-traps.test.mjs scripts/space-tilt-sensitivity.test.mjs scripts/first-planet-touch.test.mjs scripts/first-planet-twinsun-level.test.mjs scripts/fleet-motion.test.mjs scripts/first-planet-cache-bust.test.mjs scripts/first-planet-opus-carpet.test.mjs scripts/crew-core-figure.test.mjs scripts/sector-look.test.mjs scripts/first-planet-pearce-ioki.test.mjs scripts/galia-lore-sectors.test.mjs scripts/star-base.test.mjs scripts/first-planet-planet-rules.test.mjs scripts/lore-quests.test.mjs scripts/first-planet-gamepad.test.mjs scripts/tower-gamepad-feel.test.mjs scripts/crew-core-arms.test.mjs scripts/ring-boss-ground.test.mjs scripts/ring-boss-video-fit.test.mjs scripts/first-planet-race-arch-sun.test.mjs
